name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs of the same ref to save CI minutes
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [18, 20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Fetch tree-sitter .wasm grammars from upstream releases and verify SHA-256.
      # Idempotent: if a grammar is already present and matches the manifest, it skips.
      - run: pnpm grammar-fetch
      # Build BEFORE typecheck: workspace-internal packages whose `types` point
      # to `dist/index.d.ts` (e.g. `@reponova/lang-typescript-core`, consumed
      # by `@reponova/lang-typescript` and `@reponova/lang-tsx` via `tsup
      # --noExternal`) need their `dist/` populated for downstream packages
      # to resolve their declarations during `tsc --noEmit`.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      # Quality gates (sec. 8.10 of INTEGRATION-PLAN.md):
      # ▸ test:coverage runs vitest --coverage on packages that own a
      #   real `src/extractor.ts` and enforces ≥80% on every metric for
      #   that file. Pure-rexport plugins (lang-typescript / lang-tsx /
      #   lang-javascript) are covered transitively by the
      #   lang-typescript-core gate and are excluded from the
      #   workspace-level filter to avoid false negatives.
      # ▸ size checks every published plugin's `dist/index.js` against
      #   the 50 KB raw bundle ceiling (excluding bundled WASM grammars,
      #   which ship in `grammars/` and are fetched at install time).
      # We pin both gates to a single OS/Node combination to avoid
      # paying their cost on every matrix cell — coverage thresholds and
      # size thresholds don't vary across host OS, only build settings
      # do, and we already have a typecheck/test pass on every cell.
      - if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: pnpm test:coverage
      - if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: pnpm size

  # Aggregator: this is the single check that branch protection requires.
  # It marks success only if every matrix job succeeded. Adding or removing
  # entries from the matrix never requires touching the protection rule.
  gate:
    needs: [ci-matrix]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all matrix jobs succeeded
        run: |
          result="${{ needs.ci-matrix.result }}"
          if [ "$result" != "success" ]; then
            echo "::error::ci-matrix did not succeed (result: $result)"
            exit 1
          fi
          echo "All matrix jobs passed."
