name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs of the same ref to save CI minutes
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [18, 20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Fetch tree-sitter .wasm grammars from upstream releases and verify SHA-256.
      # Idempotent: if a grammar is already present and matches the manifest, it skips.
      - run: pnpm grammar-fetch
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test

  # Aggregator: this is the single check that branch protection requires.
  # It marks success only if every matrix job succeeded. Adding or removing
  # entries from the matrix never requires touching the protection rule.
  gate:
    needs: [ci-matrix]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all matrix jobs succeeded
        run: |
          result="${{ needs.ci-matrix.result }}"
          if [ "$result" != "success" ]; then
            echo "::error::ci-matrix did not succeed (result: $result)"
            exit 1
          fi
          echo "All matrix jobs passed."
